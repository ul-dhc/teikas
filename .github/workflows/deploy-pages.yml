name: Deploy to GitHub Pages

env:
  UI_TRANSLATIONS_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vQdje0Faf7oGSgHBtNQtWvwxKOUPRhsOzqIDROVQS3vBI6MV-Za5ZIvgalOqzyNBZ389pcf-zlYOqMJ/pub?output=csv

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download interface translations from Google Sheets
        run: npm run i18n:fetch

      - name: Generate interface translations
        run: npm run i18n:generate

      - name: Check project
        run: npm run check

      - name: Build website
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
